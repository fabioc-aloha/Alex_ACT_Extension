name: Release Gate

# AP-07: VERSION/tag/CHANGELOG sync gate for the VS Code Marketplace surface.
# Authoritative spec in:
#   Alex_ACT_Supervisor/.github/skills/release-preflight/SKILL.md § Go/No-Go.
# Falsifier: re-evaluate by 2026-09-10 (90 days).

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'package.json'
      - 'CHANGELOG.md'

jobs:
  version-tag-changelog-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve target version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "source=tag" >> "$GITHUB_OUTPUT"
            echo "value=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          else
            PKG_VERSION="$(node -p "require('./package.json').version")"
            echo "source=package.json" >> "$GITHUB_OUTPUT"
            echo "value=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert package.json version matches resolved version
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ steps.version.outputs.value }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${PKG_VERSION}" != "${TARGET}" ]]; then
            echo "::error file=package.json::package.json#version is '${PKG_VERSION}', expected '${TARGET}' (from ${{ steps.version.outputs.source }})"
            exit 1
          fi
          echo "OK: package.json#version (${PKG_VERSION}) matches target (${TARGET})"

      - name: Assert CHANGELOG has entry for target version
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ steps.version.outputs.value }}"
          if ! grep -qE "^## \[${TARGET}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## [${TARGET}]' entry"
            exit 1
          fi
          echo "OK: CHANGELOG.md contains '## [${TARGET}]'"
